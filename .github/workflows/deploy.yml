name: Build & Deploy to Dokploy (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-autopaintshop
  cancel-in-progress: false

jobs:
  # Runs first: the schema is ready before the new image is built and started. If a migration fails
  # nothing is built or deployed, so the live site never runs against a missing column.
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: yarn tsx scripts/db-migrate.ts

      # Read-only: confirms every migration is recorded and every table and column exists.
      - name: Verify schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: yarn tsx scripts/db-verify.ts

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SITE_ENV=production
            NEXT_PUBLIC_APP_URL=https://autopaintshop.ie
            NEXT_PUBLIC_API_PREFIX=/api
            NEXT_PUBLIC_API_VERSION=/v1
            MEDIA_PUBLIC_URL=https://pub-a7f10d56b2724809900a4af33f0a310c.r2.dev
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          tags: |
            ghcr.io/mdnhs/vantage:latest
            ghcr.io/mdnhs/vantage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dokploy (autopaintshop.ie)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          echo "Triggering Dokploy deploy for autopaintshop (autopaintshop.ie)..."
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "::error::Dokploy secrets are not set (DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_APPLICATION_ID)."
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}"
          echo "Deployment successfully triggered on Dokploy."
